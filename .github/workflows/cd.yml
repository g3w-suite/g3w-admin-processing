name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-qprocessing
  queue: max

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select next version
        id: version
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag=$(git tag --points-at "$COMMIT_SHA" -l 'v*' --format='%(refname:short) %(contents:subject)' | sed -n "s/^\(v[0-9][0-9]*\.[0-9]\.[0-9]\) Automated release for $COMMIT_SHA$/\1/p" | head -n 1)
          if [ -z "$tag" ]; then
            latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]\.[0-9]$' | sort -V | tail -n 1)
            test -n "$latest" || { echo "No stable version tag found" >&2; exit 1; }
            bump() {
              local major minor patch
              IFS=. read -r major minor patch <<< "${1#v}"
              patch=$((patch + 1))
              if [ "$patch" -eq 10 ]; then
                patch=0
                minor=$((minor + 1))
              fi
              if [ "$minor" -eq 10 ]; then
                minor=0
                major=$((major + 1))
              fi
              echo "v$major.$minor.$patch"
            }
            test "$(bump v1.2.3)" = v1.2.4
            test "$(bump v1.2.9)" = v1.3.0
            test "$(bump v1.9.9)" = v2.0.0
            tag=$(bump "$latest")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$COMMIT_SHA" -m "Automated release for $COMMIT_SHA"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "refs/tags/$TAG"
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          released=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')
          previous=
          while IFS= read -r candidate; do
            if [ "$candidate" != "$TAG" ] && grep -Fxq -- "$candidate" <<< "$released"; then
              previous=$candidate
              break
            fi
          done < <(git tag --merged "$COMMIT_SHA" --sort=-version:refname)

          notes="$RUNNER_TEMP/release-notes.md"
          printf '## Commits\n\n' > "$notes"
          if [ -n "$previous" ]; then
            git log --no-merges --format="- [%h](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s" "$previous..$COMMIT_SHA" >> "$notes"
            gh release create "$TAG" dist/* --verify-tag --generate-notes --notes-start-tag "$previous" --notes-file "$notes"
          else
            git log --no-merges --format="- [%h](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s" "$COMMIT_SHA" >> "$notes"
            gh release create "$TAG" dist/* --verify-tag --generate-notes --notes-file "$notes"
          fi
