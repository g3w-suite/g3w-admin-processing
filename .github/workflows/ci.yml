name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - name: Check wheel contents
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile

          with ZipFile(glob("dist/*.whl")[0]) as wheel:
              files = set(wheel.namelist())
          assert {
              "qprocessing/api/views/actions.py",
              "qprocessing/migrations/0001_initial.py",
              "qprocessing/utils/data.py",
              "qprocessing/static/qprocessing/js/plugin.js",
              "qprocessing/templates/qprocessing/project_form.html",
          } <= files
          PY

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: g3w-suite/g3w-admin
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Install plugin source
        run: |
          mv plugin/qprocessing g3w-admin/
          cp plugin/requirements.txt plugin/requirements-test.txt g3w-admin/qprocessing/
      - name: Start services
        run: docker compose -f docker-compose.ltr.yml up -d
      - name: Copy source into container
        run: docker cp . "$(docker compose -f docker-compose.ltr.yml ps -q g3w-suite)":/code
      - name: Install dependencies
        run: |
          docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c \
            'cd /code && pip3 install --break-system-packages -r requirements_docker.txt -r requirements_huey.txt -r g3w-admin/qprocessing/requirements.txt -r g3w-admin/qprocessing/requirements-test.txt'
      - name: Configure and set up G3W-ADMIN
        run: |
          docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c \
            'printf "\nG3WADMIN_LOCAL_MORE_APPS = [\"qprocessing\"]\nfrom base.settings.base import THIRD_PARTY_APPS\nTHIRD_PARTY_APPS = THIRD_PARTY_APPS + [\"behave_django\"]\n" >> /code/settings_docker.py && /code/ci_scripts/build_suite.sh && /code/ci_scripts/setup_suite.sh && printf "\nfrom base.settings.tests_settings import *\n" >> /code/g3w-admin/base/settings/local_settings.py'
      - name: Run plugin tests
        run: |
          docker compose -f docker-compose.ltr.yml exec -T g3w-suite sh -c \
            'cd /code/g3w-admin && python3 manage.py behave --simple qprocessing/tests'
